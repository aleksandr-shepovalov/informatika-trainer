<script>
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pk=a=>a[ri(0,a.length-1)];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const pn=(a,n)=>sh(a).slice(0,n);
const F=n=>String(Math.round(n*1e6)/1e6).replace('.',',').replace('-','−');
const nm=s=>String(s).toLowerCase().replace(/ё/g,'е').replace(/[^а-яa-z0-9]/g,'');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const pre=c=>'<pre>'+esc(c)+'</pre>';
const T=[
{id:'mod',n:'Модели и моделирование',i:'🧪',s:'Виды моделей, этапы, формализация · §1.1–§1.2'},
{id:'graf',n:'Графы и таблицы',i:'🕸️',s:'Пути, степени вершин, деревья · §1.3–§1.4'},
{id:'db',n:'Базы данных',i:'🗄️',s:'Записи, поля, запросы на выборку · §1.5–§1.6'},
{id:'alg',n:'Алгоритмы: что выведет программа',i:'⚙️',s:'Циклы, ветвления, трассировка · §2.1, §2.3, §2.5'},
{id:'arr',n:'Массивы',i:'📚',s:'Обработка одномерных массивов · §2.2'},
{id:'pas',n:'Подпрограммы и Паскаль',i:'🧱',s:'Процедуры и функции · §2.4'},
{id:'xl',n:'Электронные таблицы',i:'📊',s:'Ссылки, функции, диаграммы · гл. 3'},
{id:'inf',n:'Кодирование и измерение информации',i:'💾',s:'Системы счисления, объёмы (повторение для ОГЭ)'},
{id:'logic',n:'Логика',i:'🔀',s:'И, ИЛИ, НЕ, таблицы истинности (повторение для ОГЭ)'},
{id:'net',n:'Сети и Интернет',i:'🌐',s:'IP, URL, протоколы, скорость · гл. 4'}];
const LET=['А','Б','В','Г','Д','Е','Ж'];
const mcb=arr=>()=>{const[q,a,w,h,e]=pk(arr);return{q,o:[a,...w],h:h||'Вспомни текст параграфа.',e:e||'Верный ответ: '+a}};
const tf=(q,t,e,h)=>({q,o:['Верно','Неверно'],fix:1,ci0:t?0:1,h:h||'Подумай и сверься с учебником.',e});
const MP=[['Модель','новый объект, отражающий существенные признаки изучаемого объекта'],['Моделирование','метод познания, состоящий в создании и исследовании моделей'],['Формализация','замена реального объекта его формальным описанием'],['Информационная модель','описание объекта-оригинала на одном из языков кодирования информации'],['Натурная (материальная) модель','реальный предмет, воспроизводящий свойства оригинала (макет, глобус)'],['Динамическая модель','модель, отражающая изменение объекта во времени'],['Статическая модель','модель, описывающая объект в определённый момент времени'],['Знаковая модель','информационная модель, выраженная специальными знаками (формулы, текст, программа)'],['Объект-оригинал','то, что моделируется (прототип модели)']];
// ---- вспомогательные
const COL='ABCDEFGH';
const shf=(ref,dx,dy)=>{const m=/^(\$?)([A-H])(\$?)(\d+)$/.exec(ref);let c=COL.indexOf(m[2]),r=+m[4];if(!m[1])c+=dx;if(!m[3])r+=dy;return m[1]+COL[c]+m[3]+r};
const mkref=(t,c,r)=>[COL[c]+r,'$'+COL[c]+r,COL[c]+'$'+r,'$'+COL[c]+'$'+r][t];
const SUR=[['Иванов','м'],['Петрова','ж'],['Сидоров','м'],['Кузнецова','ж'],['Смирнов','м'],['Орлова','ж'],['Попов','м'],['Волкова','ж'],['Морозов','м'],['Лебедева','ж']];
const G={
mod:[
()=>{const t=pk(MP),w=pn(MP.filter(x=>x!==t),3);return{q:'Какой термин определён так: «'+t[1]+'»?',o:[t[0],...w.map(x=>x[0])],h:'§1.1. Прочитай «Ключевые слова» и определения в параграфе.',e:t[0]+' — '+t[1]}},
()=>{const t=pk(MP),w=pn(MP.filter(x=>x!==t),3);return{q:'Что означает термин «'+t[0]+'»?',o:[t[1],...w.map(x=>x[1])],h:'§1.1–§1.2.',e:t[0]+' — '+t[1]}},
()=>{const t=pk(MP),ok=Math.random()<.5,d=ok?t:pk(MP.filter(x=>x!==t));return tf('Верно ли: «'+t[0]+'» — это '+d[1]+'?',ok,t[0]+' — '+t[1])},
mcb([['Глобус — это модель…','натурная (материальная)',['информационная знаковая','математическая','словесная'],'§1.1.'],['Какая модель описывается формулой S = v · t?','знаковая (математическая)',['натурная','образная (рисунок)','словесная'],'§1.2.2.'],['Что делают на этапе формализации при построении информационной модели?','заменяют описание объекта формальным (знаковым) описанием',['проводят компьютерный эксперимент','анализируют результаты','выбирают объект моделирования'],'§1.1.2.'],['Географическая карта относится к…','смешанным информационным моделям',['только словесным моделям','натурным моделям','только математическим моделям'],'§1.1.3.'],['Модель, отражающая изменение объекта с течением времени, называется…','динамической',['статической','натурной','образной'],'§1.1.3.'],['С какой целью создают модель объекта?','изучить существенные свойства объекта и упростить исследование',['сделать точную копию объекта','заменить объект навсегда','скопировать все свойства оригинала'],'§1.1.1.'],['Что такое компьютерная математическая модель?','математическая модель, реализованная с помощью программы',['рисунок на компьютере','физический макет','словесное описание на экране'],'§1.2.3.'],['Что является первым шагом при построении информационной модели?','описание задачи и определение цели моделирования',['компьютерный эксперимент','анализ результатов','формализация'],'§1.1.2.']])],
graf:[
()=>{const n=pk([5,6]);let E,ans,t=0;do{E=[];for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)if(Math.random()<.5)E.push([i,j]);const d=Array(n).fill(0);d[0]=1;for(let j=1;j<n;j++)for(const[a,b]of E)if(b===j)d[j]+=d[a];ans=d[n-1]}while((ans<2||ans>14||E.length<n+1||E.length>n+4)&&++t<500);return{q:'Между пунктами проложены односторонние дороги: '+E.map(([a,b])=>LET[a]+'→'+LET[b]).join(', ')+'. Сколько существует разных путей из пункта А в пункт '+LET[n-1]+'?',a:ans,h:'Для каждого пункта посчитай число путей: сумма путей из тех пунктов, откуда в него ведут дороги. §1.3.3.',e:'Считаем количество путей по пунктам по порядку. Для '+LET[n-1]+' получилось '+ans}},
()=>{const n=pk([5,6]);let E,ans,t=0;do{E=[];for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)if(Math.random()<.55)E.push([i,j,ri(1,9)]);const d=Array(n).fill(Infinity);d[0]=0;for(let j=1;j<n;j++)for(const[a,b,w]of E)if(b===j)d[j]=Math.min(d[j],d[a]+w);ans=d[n-1]}while((!isFinite(ans)||E.length<n+1||E.length>n+3)&&++t<500);return{q:'Между пунктами проложены односторонние дороги (в скобках — длина): '+E.map(([a,b,w])=>LET[a]+'→'+LET[b]+' ('+w+')').join(', ')+'. Найдите длину кратчайшего пути из А в '+LET[n-1]+'.',a:ans,h:'Для каждого пункта находи минимальную длину пути до него. §1.3.3.',e:'Кратчайший путь из А в '+LET[n-1]+' равен '+ans}},
()=>{const n=ri(6,15);return{q:'В дереве '+n+' вершин. Сколько в нём рёбер?',a:n-1,h:'У каждой вершины, кроме корня, ровно один «родитель». §1.3.2.',e:'Рёбер на 1 меньше, чем вершин: '+n+' − 1 = '+(n-1)}},
()=>{const n=pk([5,6]);let E,m,t=0;do{E=[];for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)if(Math.random()<.5)E.push([i,j])}while(E.length<4&&++t<200);const d=Array(n).fill(0);E.forEach(([a,b])=>{d[a]++;d[b]++});return{q:'Степени вершин графа: '+d.map((x,i)=>LET[i]+' — '+x).join('; ')+'. Сколько в графе рёбер?',a:E.length,h:'Каждое ребро учитывается в степенях двух вершин. Сумма степеней = 2 · число рёбер.',e:'Сумма степеней '+d.reduce((a,b)=>a+b,0)+', рёбер — '+E.length}},
mcb([['Как называется граф, который связен и не содержит циклов?','дерево',['полный граф','таблица','маршрут'],'§1.3.2.'],['Как называются вершины, соединённые ребром?','смежными',['изолированными','корневыми','листовыми'],'§1.3.2.'],['Что такое степень вершины графа?','число рёбер, выходящих из вершины',['число всех вершин','длина самого длинного пути','число циклов'],'§1.3.2.'],['Как называется вершина дерева, из которой выходят все остальные?','корень',['лист','ветвь','цикл'],'§1.3.2.'],['Какая информационная модель лучше всего показывает связи между объектами?','граф',['формула','текст','диаграмма'],'§1.3.']])],
db:[
()=>{let recs,cs,ans,t=0;const X=pk([60,70,80]),C=[['Пол = «ж»',r=>r.sex==='ж'],['Класс = «9А»',r=>r.cl==='9А'],['Балл > '+X,r=>r.b>X]];do{recs=pn(SUR,8).map(s=>({s:s[0],sex:s[1],cl:pk(['9А','9Б','10А']),b:ri(40,100)}));cs=pn(C,2);var op=pk(['И','ИЛИ']);ans=recs.filter(r=>op==='И'?cs[0][1](r)&&cs[1][1](r):cs[0][1](r)||cs[1][1](r)).length}while((ans<1||ans>6)&&++t<300);const tb='Фамилия    Пол  Класс  Балл\n'+recs.map(r=>r.s.padEnd(11)+r.sex.padEnd(5)+r.cl.padEnd(7)+r.b).join('\n');return{q:'Дана таблица базы данных:'+pre(tb)+'Сколько записей будет выбрано по запросу: ('+cs[0][0]+') '+op+' ('+cs[1][0]+')?',a:ans,h:'Проверь каждую строку: «И» — оба условия верны сразу, «ИЛИ» — хотя бы одно. §1.6.4.',e:'Подходят записей: '+ans}},
mcb([['Как называется строка таблицы базы данных?','запись',['поле','ключ','запрос'],'§1.5.2.'],['Как называется столбец таблицы базы данных?','поле',['запись','отчёт','форма'],'§1.5.2.'],['Что такое ключевое поле?','поле, значения которого не повторяются',['самое длинное поле','поле с числами','первое поле таблицы'],'§1.5.2.'],['Что такое СУБД?','система управления базами данных',['система учёта баз документов','средство быстрого доступа','сервер баз данных'],'§1.6.1.'],['Что такое запрос на выборку?','требование найти в базе записи, удовлетворяющие условию',['способ удалить таблицу','сортировка таблицы','создание формы'],'§1.6.4.'],['Что такое реляционная база данных?','база, в которой данные хранятся в виде связанных таблиц',['база только из одной строки','база, хранящая только рисунки','текстовый документ'],'§1.5.2.'],['Какое условие в запросе выберет записи, в которых выполняются оба условия сразу?','И',['ИЛИ','НЕ','ЛИБО'],'§1.6.4.']])],
alg:[
()=>{const s0=ri(0,5),a=ri(1,4),b=a+ri(2,5),c=ri(1,3);let s=s0;for(let i=a;i<=b;i++)s+=i*c;return{q:'Что будет выведено на экран?'+pre(`s := ${s0};\nfor i := ${a} to ${b} do\n  s := s + i${c>1?' * '+c:''};\nwrite(s);`),a:s,h:'Выпиши в таблицу значения i и s на каждом шаге цикла.',e:'Результат: '+s}},
()=>{const d=ri(3,7),N=ri(20,60);let n=N,k=0;while(n>=d){n-=d;k++}const w=Math.random()<.5;return{q:'Что будет выведено на экран?'+pre(`n := ${N}; k := 0;\nwhile n >= ${d} do begin\n  n := n - ${d};\n  k := k + 1;\nend;\nwrite(${w?'k':'n'});`),a:w?k:n,h:'Цикл повторяется, пока условие верно. Ведите таблицу значений n и k.',e:`Цикл выполнится ${k} раз, n = ${n}, k = ${k}`}},
()=>{const A=ri(5,30),B=ri(5,30);let c=A>B?A-B:B-A;c=c%2===0?c/2:c*3;return{q:'Что будет выведено на экран?'+pre(`a := ${A}; b := ${B};\nif a > b then c := a - b\n         else c := b - a;\nif c mod 2 = 0 then c := c div 2\n               else c := c * 3;\nwrite(c);`),a:c,h:'Сначала найди c по первому условию, потом проверь чётность (mod — остаток от деления).',e:'Результат: '+c}},
()=>{let A=ri(12,72),B=ri(12,72);const a0=A,b0=B;while(A!==B){if(A>B)A-=B;else B-=A}return{q:'Что будет выведено на экран?'+pre(`a := ${a0}; b := ${b0};\nwhile a <> b do\n  if a > b then a := a - b\n           else b := b - a;\nwrite(a);`),a:A,h:'Это алгоритм Евклида (вычитание). Ведите таблицу значений a и b.',e:'Выводится НОД чисел '+a0+' и '+b0+' = '+A}},
()=>{const N=ri(100,9999);let n=N,s=0;while(n>0){s+=n%10;n=Math.floor(n/10)}return{q:'Что будет выведено на экран?'+pre(`n := ${N}; s := 0;\nwhile n > 0 do begin\n  s := s + n mod 10;\n  n := n div 10;\nend;\nwrite(s);`),a:s,h:'n mod 10 — последняя цифра числа, n div 10 — число без последней цифры.',e:'Сумма цифр числа '+N+' = '+s}},
()=>{const n=ri(3,8);let a=1,b=1;for(let i=1;i<=n;i++){const c=a+b;a=b;b=c}return{q:'Что будет выведено на экран?'+pre(`a := 1; b := 1;\nfor i := 1 to ${n} do begin\n  c := a + b;\n  a := b;\n  b := c;\nend;\nwrite(b);`),a:b,h:'Запиши значения a, b, c после каждого шага цикла.',e:'Результат: '+b}},
()=>{const N=ri(10,30),k=ri(2,5);let s=0;for(let i=1;i<=N;i++)if(i%k===0)s+=i;return{q:'Что будет выведено на экран?'+pre(`s := 0;\nfor i := 1 to ${N} do\n  if i mod ${k} = 0 then s := s + i;\nwrite(s);`),a:s,h:'Условие i mod '+k+' = 0 выполняется для чисел, кратных '+k+'.',e:'Сумма чисел, кратных '+k+', от 1 до '+N+' = '+s}}],
arr:[
()=>{const n=ri(7,9),A=Array.from({length:n},()=>ri(1,30)),p=ri(0,5);let ans,code,h;
if(p===0){const X=ri(8,20);ans=A.filter(x=>x>X).length;code=`k := 0;\nfor i := 1 to ${n} do\n  if A[i] > ${X} then k := k + 1;\nwrite(k);`;h='Посчитай, сколько элементов больше '+X+'.'}

else if(mode==='weak'){const w=T.map(t=>{const a=acc(t.id);return[t.id,a===null?.5:1.1-a/100]});const sum=w.reduce((s,x)=>s+x[1],0);for(let i=0;i<N;i++){let r=Math.random()*sum;for(const x of w){r-=x[1];if(r<=0){ids.push(x[0]);break}}}while(ids.length<N)ids.push(pk(T).id)}
else{ids=sh(T.map(t=>t.id));while(ids.length<N)ids.push(pk(T).id);ids=sh(ids).slice(0,N)}
const seen=new Set(),qs=[];for(const i of ids){let q,n=0;do{q=mk(i)}while(seen.has(q.q)&&++n<40);seen.add(q.q);qs.push(q)}
S={mode,id,qs,i:0,res:[],locked:false,hu:false,sel:-1,ms:[]};qv()}
function qv(){const q=S.qs[S.i],test=S.mode==='test',n=S.qs.length,tp=T.find(t=>t.id===q.t);S.hu=false;S.sel=-1;S.ms=[];
const body=q.type==='mc'?q.opts.map((o,k)=>`<button class="opt" id="o${k}" onclick="pick(${k})">${esc(o)}</button>`).join(''):q.type==='ms'?'<div class="sub">Выберите все верные варианты</div>'+q.opts.map((o,k)=>`<button class="opt" id="o${k}" onclick="tog(${k})">${esc(o)}</button>`).join(''):'<input id="ans" autocomplete="off" inputmode="'+(q.type==='num'?'decimal':'text')+'" placeholder="'+(q.type==='num'?'Ответ — число':'Введите ответ')+'">';
$('#app').innerHTML=`<div class="top"><button class="g" onclick="if(confirm('Выйти? Ответы уже сохранены в статистике.'))home()">← Меню</button><span>${S.i+1} / ${n}${test?' · тест':''}</span></div><div class="bar"><i style="width:${S.i/n*100}%"></i></div>
<div class="card"><div class="tag">${tp.i} ${tp.n}</div><div class="q">${q.q}</div>${body}
<div id="hint" class="hint" hidden></div><div class="row">${test?'':'<button class="g" onclick="hint()">💡 Подсказка</button>'}<button class="p" id="chk" onclick="check()">${test?'Ответить':'Проверить'}</button></div><div id="fb"></div></div>`;
const a=$('#ans');if(a){a.focus();a.onkeydown=e=>{if(e.key==='Enter')check()}}}
function pick(k){if(S.locked)return;S.sel=k;document.querySelectorAll('.opt').forEach((b,i)=>b.classList.toggle('sel',i===k))}
function tog(k){if(S.locked)return;const i=S.ms.indexOf(k);i<0?S.ms.push(k):S.ms.splice(i,1);$('#o'+k).classList.toggle('sel',i<0)}
function hint(){if(S.locked)return;const h=$('#hint');h.hidden=false;h.innerHTML='💡 '+S.qs[S.i].h;S.hu=true}
function check(){if(S.locked)return;const q=S.qs[S.i],test=S.mode==='test';let ok,user,cor;
if(q.type==='mc'){if(S.sel<0)return;ok=S.sel===q.ci;user=q.opts[S.sel];cor=q.opts[q.ci]}
else if(q.type==='ms'){if(!S.ms.length)return;ok=S.ms.slice().sort().join()===q.cs.slice().sort().join();user=S.ms.map(i=>q.opts[i]).join(', ');cor=q.cs.map(i=>q.opts[i]).join(', ')}
else if(q.type==='txt'){const raw=$('#ans').value;if(!raw.trim())return;ok=nm(raw)===nm(q.x);user=raw.trim();cor=q.x}
else{const raw=$('#ans').value;if(!raw.trim())return;const x=parseFloat(raw.replace(/\s/g,'').replace(',','.').replace('−','-'));ok=isFinite(x)&&Math.abs(x-q.a)<1e-6;user=raw.trim();cor=F(q.a)}
S.res.push({q,ok,user,cor,hu:S.hu});
const t=ST.t[q.t]||(ST.t[q.t]={ok:0,bad:0,h:0});ok?t.ok++:t.bad++;if(S.hu)t.h++;save();
if(test){nextQ();return}
S.locked=true;
if(q.type==='mc')document.querySelectorAll('.opt').forEach((b,i)=>{if(i===q.ci)b.classList.add('ok');else if(i===S.sel)b.classList.add('no')});
else if(q.type==='ms')document.querySelectorAll('.opt').forEach((b,i)=>{const c=q.cs.includes(i),s=S.ms.includes(i);if(c)b.classList.add('ok');else if(s)b.classList.add('no')});
else $('#ans').disabled=true;
$('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'✅ Верно!'+(S.hu?' (с подсказкой)':''):'❌ Неверно. Правильный ответ: '+esc(cor)}</b><br><small>${q.e}</small></div>`;
const c=$('#chk');c.textContent=S.i+1>=S.qs.length?'Результат →':'Дальше →';c.onclick=nextQ}
function nextQ(){S.locked=false;S.i++;S.i>=S.qs.length?finish():qv()}
function finish(){const ok=S.res.filter(r=>r.ok).length,n=S.res.length;ST.h.push({ts:Date.now(),m:S.mode,ok,n});ST.h=ST.h.slice(-30);save();
const p=Math.round(ok/n*100),errs=S.res.filter(r=>!r.ok),test=S.mode==='test';
let h=`<div class="card" style="text-align:center"><div class="m">Результат</div><div class="big2" style="color:${col(p)}">${ok} из ${n} · ${p}%</div>${test?`<div class="m">Ориентировочная оценка: <b>${p>=85?5:p>=65?4:p>=40?3:2}</b></div>`:''}<div class="row"><button class="p" onclick="start('${S.mode}',${S.id?`'${S.id}'`:'null'})">Ещё раз (новые задания)</button><button onclick="home()">В меню</button></div></div>`;
if(errs.length)h+='<h2>Разбор ошибок</h2><div class="card">'+errs.map(r=>`<div class="err"><div>${r.q.q}</div><small>Твой ответ: ${esc(r.user)} · Правильно: <b>${esc(r.cor)}</b><br>${r.q.e}</small></div>`).join('')+'</div>';
else h+='<p class="m" style="text-align:center">Без ошибок! 🎉</p>';
$('#app').innerHTML=h}
function stats(){let ok=0,bad=0,hh=0;Object.values(ST.t).forEach(t=>{ok+=t.ok;bad+=t.bad;hh+=t.h});const n=ok+bad,p=n?Math.round(ok/n*100):0;
let h=`<div class="top"><button class="g" onclick="home()">← Меню</button><b>Статистика</b><span></span></div>`;
if(!n)return $('#app').innerHTML=h+'<div class="card m">Пока нет данных — ответьте на несколько заданий.</div>';
h+=`<div class="card" style="text-align:center"><div class="big2" style="color:${col(p)}">${p}%</div><div class="m">верных ответов · всего ${n} (✅ ${ok} / ❌ ${bad}) · с подсказкой: ${hh}</div></div><h2>По темам</h2><div class="card">`;
const rows=T.map(t=>({t,a:acc(t.id),d:ST.t[t.id]||{ok:0,bad:0,h:0}}));
rows.forEach(r=>{h+=`<div class="rb"><span>${r.t.i} ${r.t.n}</span><span class="t"><i style="width:${r.a||0}%;background:${col(r.a)}"></i></span><span style="width:84px;text-align:right">${r.a===null?'—':r.a+'% ('+r.d.ok+'/'+(r.d.ok+r.d.bad)+')'}</span></div>`});
h+='</div>';const weak=rows.filter(r=>r.a!==null&&r.d.ok+r.d.bad>=3&&r.a<60).sort((a,b)=>a.a-b.a);
h+='<h2>На что обратить внимание</h2><div class="card">'+(weak.length?weak.map(r=>`<div class="rb"><span style="width:auto;flex:1">⚠️ ${r.t.n} — ${r.a}%</span><button onclick="start('topic','${r.t.id}')">Тренировать</button></div>`).join(''):'<span class="m">Слабых тем пока нет (нужно хотя бы 3 ответа по теме и точность ниже 60%).</span>')+'</div>';
const best=rows.filter(r=>r.a!==null&&r.d.ok+r.d.bad>=3&&r.a>=80);if(best.length)h+=`<p class="m">💪 Сильные темы: ${best.map(r=>r.t.n).join(', ')}</p>`;
if(ST.h.length){const l=ST.h.slice(-12);h+='<h2>Динамика по занятиям</h2><div class="card"><div class="ch">'+l.map(s=>{const q=Math.round(s.ok/s.n*100);return`<div title="${q}%" style="height:${Math.max(q,3)}%;background:${col(q)}"></div>`}).join('')+`</div><div class="m" style="font-size:.8rem">Последние ${l.length} занятий (слева — старые). Последнее: ${l[l.length-1].ok}/${l[l.length-1].n}, ${new Date(l[l.length-1].ts).toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</div></div>`}
h+='<p style="text-align:center"><button class="g" onclick="if(confirm(\'Сбросить всю статистику?\')){ST={t:{},h:[]};save();stats()}">Сбросить статистику</button></p>';
$('#app').innerHTML=h}
home();
</script></body></html>
